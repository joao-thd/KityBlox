<div
  id="account-sidebar-root"
  class="bg-muted/90 backdrop-blur-sm border border-white/10 rounded-cc p-5 sm:p-6 sticky top-24 shadow-sm"
>
  <div class="text-center mb-5 pb-5 border-b border-white/10">
    <div id="account-sidebar-avatar-wrap" class="relative mx-auto mb-4 w-20 h-20">
      <% if user and user.avatar %>
        <img
          src="<%= user.avatar %>"
          class="size-20 rounded-full object-cover mx-auto ring-2 ring-white/10"
          alt=""
          id="account-sidebar-avatar-img"
        />
      <% else %>
        <div
          id="account-sidebar-avatar-fallback"
          class="w-20 h-20 bg-primary/15 rounded-full flex items-center justify-center mx-auto ring-2 ring-white/10"
        >
          <i class="ph ph-user size-10 text-primary/90" aria-hidden="true"></i>
        </div>
        <img
          id="account-sidebar-avatar-img"
          class="size-20 rounded-full object-cover mx-auto ring-2 ring-white/10 hidden absolute inset-0"
          alt=""
        />
      <% endif %>
    </div>
    <h3 id="account-sidebar-display-name" class="font-semibold text-lg mb-0.5 tracking-tight">
      <% if user and user.name %><%= user.name %><% else %>Minha conta<% endif %>
    </h3>
    <p id="account-sidebar-email" class="text-xs text-muted-foreground truncate px-1 min-h-[1rem] hidden"></p>
    <p class="text-[11px] font-medium uppercase tracking-wide text-muted-foreground mt-2">Área do cliente</p>
  </div>

  <nav class="space-y-5" aria-label="Menu da conta">
    <div>
      <p class="text-[11px] font-semibold uppercase tracking-wide text-muted-foreground px-1 mb-2">Conta</p>
      <div class="flex flex-col gap-1">
        <a
          href="/account/profile"
          data-account-path="/account/profile"
          class="account-nav-link group flex items-center gap-3 rounded-lg px-3 h-10 text-sm font-medium text-foreground/90 transition hover:bg-white/5 border border-transparent <% if pathname == '/account/profile' %>bg-white/10 border-white/10 text-foreground<% endif %>"
        >
          <span class="flex size-8 shrink-0 items-center justify-center rounded-md bg-white/5 text-muted-foreground group-hover:text-foreground">
            <i class="ph ph-user size-4" aria-hidden="true"></i>
          </span>
          <span class="text-start">Meu perfil</span>
        </a>
        <a
          href="/account/orders"
          data-account-path="/account/orders"
          class="account-nav-link group flex items-center gap-3 rounded-lg px-3 h-10 text-sm font-medium text-foreground/90 transition hover:bg-white/5 border border-transparent <% if pathname == '/account/orders' %>bg-white/10 border-white/10 text-foreground<% endif %>"
        >
          <span class="flex size-8 shrink-0 items-center justify-center rounded-md bg-white/5 text-muted-foreground group-hover:text-foreground">
            <i class="ph ph-package size-4" aria-hidden="true"></i>
          </span>
          <span class="text-start">Minhas compras</span>
        </a>
      </div>
    </div>

    <div>
      <p class="text-[11px] font-semibold uppercase tracking-wide text-muted-foreground px-1 mb-2">Programas</p>
      <div class="flex flex-col gap-1">
        <a
          href="/account/affiliate"
          data-account-path="/account/affiliate"
          class="account-nav-link group flex items-center gap-3 rounded-lg px-3 h-10 text-sm font-medium text-foreground/90 transition hover:bg-white/5 border border-transparent <% if pathname == '/account/affiliate' %>bg-white/10 border-white/10 text-foreground<% endif %>"
        >
          <span class="flex size-8 shrink-0 items-center justify-center rounded-md bg-white/5 text-muted-foreground group-hover:text-foreground">
            <i class="ph ph-chart-line-up size-4" aria-hidden="true"></i>
          </span>
          <span class="text-start">Área do afiliado</span>
        </a>
        <a
          href="/account/loyalty"
          data-account-path="/account/loyalty"
          class="account-nav-link group flex items-center gap-3 rounded-lg px-3 h-10 text-sm font-medium text-foreground/90 transition hover:bg-white/5 border border-transparent <% if pathname == '/account/loyalty' %>bg-white/10 border-white/10 text-foreground<% endif %>"
        >
          <span class="flex size-8 shrink-0 items-center justify-center rounded-md bg-white/5 text-muted-foreground group-hover:text-foreground">
            <i class="ph ph-coins size-4" aria-hidden="true"></i>
          </span>
          <span class="text-start">Fidelidade</span>
        </a>
      </div>
    </div>

    <div class="h-px bg-white/10 w-full"></div>

    <div class="flex flex-col gap-1 pt-0.5">
      <a
        href="/"
        class="group flex items-center gap-3 rounded-lg px-3 h-10 text-sm font-medium text-muted-foreground transition hover:bg-white/5 hover:text-foreground"
      >
        <span class="flex size-8 shrink-0 items-center justify-center rounded-md bg-white/5">
          <i class="ph ph-house size-4" aria-hidden="true"></i>
        </span>
        <span>Voltar para a loja</span>
      </a>
      <button
        type="button"
        id="account-sidebar-logout"
        class="group w-full flex items-center gap-3 rounded-lg px-3 h-10 text-sm font-medium text-red-400/90 transition hover:bg-red-500/10 text-start"
      >
        <span class="flex size-8 shrink-0 items-center justify-center rounded-md bg-red-500/10">
          <i class="ph ph-sign-out size-4" aria-hidden="true"></i>
        </span>
        <span>Sair da conta</span>
      </button>
    </div>
  </nav>
</div>
