<% layout "layouts/layout", page_title: 'Pedido', robots: 'noindex, nofollow', scripts: '/scripts/shop-order-detail.js?v=10' %>

<script>
  window.__NERIX_NO_IMAGE__ = '<%= 'public/assets/templates/KOPY/no-image.png' | cdn %>';
  window.__NERIX_CDN_BASE__ = (function () {
    var sample = '<%= 'public/36x36.png' | cdn %>';
    var marker = '/public/';
    var idx = sample.indexOf(marker);
    return idx > 0 ? sample.slice(0, idx) : sample.replace(/\/[^/]+$/, '');
  })();
</script>

<main class="container max-w-7xl min-h-[70vh] py-8">
  <div class="mb-6">
    <a href="/" class="inline-flex items-center gap-2 text-sm font-medium text-muted-foreground">
      <i class="ph ph-arrow-left size-4" aria-hidden="true"></i>
      Voltar para a loja
    </a>
  </div>

  <div id="order-detail-loading" class="flex justify-center py-20">
    <div
      class="size-10 border-2 border-white/20 border-t-primary rounded-full animate-spin"
      aria-hidden="true"
    ></div>
  </div>

  <div id="order-detail-guest" class="hidden text-center py-16 border border-white/10 rounded-cc bg-muted/40">
    <p class="text-muted-foreground mb-4">Entre na sua conta para ver os detalhes deste pedido.</p>
    <a href="/login" class="btn-primary h-9 inline-flex">Entrar</a>
  </div>

  <div id="order-detail-error" class="hidden text-center py-16 border border-red-500/20 rounded-cc bg-red-500/10 text-sm px-4"></div>

  <div id="order-detail-layout" class="hidden grid grid-cols-1 xl:grid-cols-3 gap-6 items-start">
    <section class="xl:col-span-2 space-y-6" id="order-detail-items"></section>
    <section class="xl:col-span-1 space-y-6" id="order-detail-summary"></section>
  </div>
</main>
